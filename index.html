/* Tokens for every page: ink on paper, one blue, hairline borders. */
:root { --nb-bg: #fff; --nb-subtle: #f6f8fa; --nb-line: #e3e8ee; --nb-ink: #10161d; --nb-ink-2: #46525e; --nb-ink-3: #5b6875; --nb-accent: #0a66c2; --nb-surface: #fff; color-scheme: light; font-synthesis: none; text-rendering: optimizeLegibility; scroll-behavior: smooth; }

html, body, #root { min-height: 100%; margin: 0; }

.notebook-shell { min-height: 100svh; color: var(--nb-ink); background: var(--nb-bg); font: 16px/1.6 'Geist Sans', 'Geist Fallback', ui-sans-serif, system-ui, sans-serif; }
.notebook-shell *, .notebook-shell *::before, .notebook-shell *::after { box-sizing: border-box; }
/* Zero-specificity defaults, so a component's own class always wins over them. */
.notebook-shell :where(a) { color: inherit; }
.notebook-shell :where(button) { font: inherit; cursor: pointer; }
.notebook-shell :where(svg) { width: 15px; height: 15px; flex: 0 0 auto; }

/* Header (also used on every other page through SiteHeader) */
.notebook-header { position: sticky; z-index: 20; top: 0; border-bottom: 1px solid var(--nb-line); background: color-mix(in srgb, var(--nb-bg) 94%, transparent); -webkit-backdrop-filter: saturate(1.5) blur(12px); backdrop-filter: saturate(1.5) blur(12px); }
/* At the very top the header sits on the page; its hairline appears once the page scrolls under it. */

/* Layout */
.notebook-layout { width: min(calc(100% - 48px), 960px); margin-inline: auto; }

.notebook-intro-description a, .notebook-prose a, .notebook-contact a, .notebook-feature a, .notebook-work-list a { text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 3px; transition: text-decoration-color .15s ease; }

.notebook-timeline > li.is-current .notebook-timeline-period::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-inline-end: 8px; border-radius: 50%; background: var(--nb-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--nb-accent) 18%, transparent); vertical-align: 1px; }

/* Work */
.notebook-work-featured { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; }

.notebook-work-list li a { text-decoration: none; }
.notebook-work-list li a:hover { text-decoration: underline; text-underline-offset: 3px; }
.notebook-work-list .notebook-muted { font-size: 14px; }

.notebook-post-list { border-top: 1px solid var(--nb-line); }

/* Skeletons stay static: they only hold space while a route or article loads. */
@keyframes sk-in { from { opacity: 0; } to { opacity: 1; } }
.site-skeleton, .route-skeleton { animation: sk-in 200ms ease 200ms both; }
.site-skeleton { display: grid; gap: 14px; min-height: 60vh; padding: 8px 0 40px; }
.site-skeleton span, .route-skeleton span { display: block; height: 14px; border-radius: 4px; background: var(--nb-subtle); }
.route-skeleton { display: grid; align-content: start; gap: 16px; width: min(calc(100% - 48px), 960px); min-height: 100svh; margin-inline: auto; padding-top: 140px; }
.route-skeleton .route-skeleton-title { height: 40px; width: 50%; margin-bottom: 18px; }
.site-translation-note { margin: 14px 0 0; color: var(--nb-ink-3); font-size: 14px; }

/* Arabic */
html[dir='rtl'] .notebook-shell { font-family: 'IBM Plex Sans Arabic', 'Plex Arabic Fallback', 'Geist Sans', 'Geist Fallback', ui-sans-serif, system-ui, Tahoma, sans-serif; }
html[dir='rtl'] .notebook-shell * { letter-spacing: normal; }
html[dir='rtl'] .notebook-intro h1 { line-height: 1.3; }
html[dir='rtl'] .notebook-intro-lede, html[dir='rtl'] .notebook-intro-description, html[dir='rtl'] .notebook-prose p, html[dir='rtl'] .notebook-feature p { line-height: 1.85; }

.theme-when-light, .theme-when-dark { display: inline-flex; align-items: center; gap: 6px; }
.theme-when-dark, html.dark .theme-when-light { display: none; }
html.dark .theme-when-dark { display: inline-flex; }
@media (max-width: 760px) {
  .notebook-header-inner, .notebook-layout, .notebook-footer { width: calc(100% - 32px); }
  .notebook-header-inner { min-height: 56px; }
  .notebook-desktop-nav { display: none; }
  .notebook-header-actions { margin-inline-start: auto; }
  .notebook-mobile-nav { display: flex; gap: 22px; overflow-x: auto; width: calc(100% - 32px); margin-inline: auto; padding: 0 0 6px; scrollbar-width: none; }
  .notebook-mobile-nav::-webkit-scrollbar { display: none; }
  .notebook-search-trigger, .notebook-quiet-button { min-width: 40px; min-height: 40px; justify-content: center; }
  .notebook-search-trigger span { display: none; }
  /* Visually hidden, still the button's accessible name. */
  .notebook-theme-button .theme-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .notebook-intro { grid-template-columns: 1fr; gap: 28px; padding: 44px 0 44px; }
  .notebook-portrait { order: -1; width: 112px; }
  .notebook-portrait img { border-radius: 50%; aspect-ratio: 1; }
  .notebook-section { padding: 48px 0; }
  .notebook-work-featured { grid-template-columns: 1fr; gap: 28px; }
  .notebook-timeline > li { grid-template-columns: 1fr; gap: 4px; }
  html .notebook-post-row, html[dir='rtl'] .notebook-post-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .notebook-post-row time { order: 2; }
  .notebook-post-thumb { display: none; }
  .route-skeleton { width: calc(100% - 32px); }
}

@media (prefers-reduced-motion: no-preference) {
  /* Rows settle into place as they scroll in. Transform only: content is never hidden, and nothing on the first screen moves. */
  @supports (animation-timeline: view()) {
    .notebook-timeline > li, .notebook-feature, .notebook-work-list li, .notebook-post-row, .notebook-prose, .notebook-contact-body > *, .plain-role, .related-posts li { animation: nb-settle linear both; animation-timeline: view(); animation-range: entry 0% entry 140px; }
    @keyframes nb-settle { from { transform: translateY(18px); } }
  }
  /* A page reached through an in-site link fades in. The first load never animates: html[data-nav] is set on navigation. */
  html[data-nav] :is(.notebook-main, .site-shell > main) { animation: nb-page-in .28s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes nb-page-in { from { opacity: 0; transform: translateY(8px); } }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .3s; }
}
/* Paper is white: print with the light palette, whatever theme the screen uses. */
@media print {
  html.dark { --nb-bg: #fff; --nb-subtle: #f6f8fa; --nb-line: #e3e8ee; --nb-ink: #10161d; --nb-ink-2: #46525e; --nb-ink-3: #5b6875; --nb-accent: #0a66c2; --nb-surface: #fff; color-scheme: light; }
  html.dark .notebook-post-thumb { filter: none; }
}
/* Windows High Contrast drops backgrounds; states drawn with one use system colours instead. */
@media (forced-colors: active) {
  .notebook-desktop-nav a::after, .notebook-mobile-nav a::after, .notebook-timeline > li.is-current .notebook-timeline-period::before { forced-color-adjust: none; background: Highlight; }
  /* Form fields draw focus with a shadow, which forced colors drops, so restore the outline. */
  .contact-field :is(input, textarea):focus { outline: 2px solid Highlight; outline-offset: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  :root { scroll-behavior: auto; }
  .site-skeleton, .route-skeleton { animation: none; }
}

    <!-- Theme initialization script - prevents flash of incorrect theme -->
    <script>
      // Immediately set theme to prevent FOUC
      (function() {
        try {
          const storedTheme = localStorage.getItem('theme');
          const theme = storedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
          // Update theme color meta tag
          const metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', theme === 'dark' ? '#0d1117' : '#ffffff');
          }
        } catch (e) {
          // Fallback to light theme if localStorage is not available
          document.documentElement.classList.add('light');
        }
      })();
      // Arabic pages live under /ar and are prerendered in Arabic. Old ?lang= links go to the right URL.
      (function() {
        try {
          const path = window.location.pathname;
          const arabic = path === '/ar' || path.indexOf('/ar/') === 0;
          const query = new URLSearchParams(window.location.search);
          const wanted = query.get('lang');
          if ((wanted === 'ar' && !arabic) || (wanted === 'en' && arabic)) {
            query.delete('lang');
            // One leading slash only: '//host' would leave the site.
            const rest = '/' + (wanted === 'ar' ? path : path.slice(3)).replace(/^[\/\\]+/, '');
            const target = wanted === 'ar' ? '/ar' + (rest === '/' ? '' : rest) : rest;
            window.location.replace(target + (query.toString() ? '?' + query : '') + window.location.hash);
          }
        } catch (e) {}
      })();
    </script>
